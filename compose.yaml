services:
  agromind:
    build: .
    ports:
      - "8501:8501"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      AGROMIND_DATABASE_PATH: /app/data/agromind.db
    volumes:
      - agromind-data:/app/data
    restart: unless-stopped

volumes:
  agromind-data:
